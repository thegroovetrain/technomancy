<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trance Induction</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="trance.css">
</head>
<body>
  <div id="stage">
    <canvas id="spiral"></canvas>
    <canvas id="sigil"></canvas>
  </div>

  <div id="panel" class="panel">
    <div class="panel-head">
      <a href="../../index.html">&larr; Technomancy</a>
      <span id="status" class="muted"></span>
      <button type="button" id="fullscreen" title="F">Fullscreen</button>
    </div>

    <div class="panel-body">
      <fieldset>
        <legend>Sigil</legend>
        <label>Letters <input id="letters" placeholder="NBZWRGMQTKSVJ" autocomplete="off" spellcheck="false"></label>
        <label class="file">Load JSON or SVG <input id="file" type="file" accept=".json,.svg,application/json,image/svg+xml"></label>
        <label>Size <input id="size" type="range" min="0.04" max="0.45" step="0.01" value="0.1"></label>
        <label>Thickness <input id="thick" type="range" min="0.01" max="0.12" step="0.005" value="0.037"></label>
        <label>Color <input id="color" type="color" value="#ffffff"></label>
        <label><input id="followhue" type="checkbox"> Follow hue cycle</label>
      </fieldset>

      <fieldset>
        <legend>Spiral</legend>
        <label>Speed <input id="speed" type="range" min="0" max="3" step="0.05" value="1"></label>
        <label>Hue cycle <span class="val" id="period-val">60 s</span> <input id="period" type="range" min="10" max="600" step="5" value="60"></label>
        <label>Arms <input id="arms" type="range" min="1" max="4" step="1" value="2"></label>
        <label>Tightness <input id="tight" type="range" min="2" max="24" step="1" value="8"></label>
        <label><input id="inward" type="checkbox" checked> Inward</label>
        <button type="button" id="pause" title="Space">Pause</button>
      </fieldset>

      <fieldset>
        <legend>Pink noise</legend>
        <button type="button" id="audio">Play</button>
        <label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5"></label>
      </fieldset>
    </div>
    <p class="hint muted">Keys: F fullscreen · Space pause · H hide panel. The panel hides itself when the mouse is still.</p>
  </div>

  <script src="../../js/lib/dom.js"></script>
  <script src="../../js/lib/eq.js"></script>
  <script src="../../js/lib/wheel.js"></script>
  <script src="../../js/lib/sigilfile.js"></script>
  <script src="../../js/lib/pinknoise.js"></script>
  <script src="../../js/trance/spiral.js"></script>
  <script src="../../js/trance/main.js"></script>
</body>
</html>
